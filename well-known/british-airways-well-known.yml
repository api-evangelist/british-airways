generated: '2026-07-28'
method: searched
description: >-
  Results of probing the /.well-known/ discovery surface for every British Airways host
  reachable from apis.yml. British Airways publishes no baseURL and no OpenAPI, so the hosts
  probed are the NDC Communication Hub (ndc.ba.com), the decommissioned Mashery gateway
  (api.ba.com), the marketing/booking host (www.britishairways.com), and the Microsoft Entra
  External ID CIAM tenant that the NDC hub's own MSAL configuration authenticates against
  (baexternalid.ciamlogin.com, tenant 45c0456f-2aef-40f6-847e-d3d957348527, discovered in the
  hub application bundle main.7a41cb6e4d2487f7.js).
caveat: >-
  ndc.ba.com is an Angular single-page application that answers HTTP 200 with the same ~12-17KB
  SPA shell for every path, and www.britishairways.com answers HTTP 200 with an 8,999-byte WAF
  holding page ("We are experiencing high demand on ba.com at the moment") for every path. On
  those two hosts a 200 is NOT evidence that a document exists; those results are recorded as
  soft-200 and nothing was saved from them. Only the OIDC discovery document returned a real,
  correctly-typed payload and it is the only file saved verbatim.
