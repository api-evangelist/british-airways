apis:
- aid: british-airways:british-airways-ndc-api
  name: British Airways NDC API
  description: >-
    British Airways' IATA New Distribution Capability API - a direct link into BA's host
    reservation system for flight shopping, ordering, ticketing and post-booking servicing,
    operated jointly across IAG for BA and Iberia. It implements the IATA EDIST message set
    (the ndc.ba.com application carries the XML namespace
    http://www.iata.org/IATA/EDIST/2017.2), with a 21.3 pilot programme running alongside the
    17.2 production version. The IAG developer portal described the 17.2 plan as AirShopping,
    OfferPrice, SeatAvailability, OrderCreate, OrderRetrieve, AirDocIssue, OrderChange,
    OrderReShop and OrderChangeNotif. No OpenAPI or WSDL is published, no production base URL
    is published, and there is no self-serve access - see review.yml for the full certification
    and contracting path.
  humanURL: https://ndc.ba.com/developer/api-documentation
