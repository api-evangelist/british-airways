name: British Airways
kind: company
description: >-
  British Airways Plc is the United Kingdom's flag carrier, headquartered at Waterside near
  London Heathrow and owned since 2011 by International Consolidated Airlines Group (IAG),
  which also owns Iberia, Aer Lingus, Vueling and LEVEL. In the distribution chain BA is a
  supplier of its own seat inventory, reached either through the three legacy GDSs, through
  IATA NDC connections it operates itself, or direct on ba.com. BA was one of the earliest
  and most aggressive NDC adopters: from 1 November 2017 IAG applied a per-fare-component
  Distribution Technology Charge to BA and Iberia marketed fares that are not booked through
  an NDC based connection or a low-cost channel such as ba.com, explicitly pricing GDS
  intermediation out of the stack. Its API posture is honest to state plainly - the NDC
  distribution API is real and is built on the IATA EDIST message set, but there is no public
  specification, no published base URL, no self-serve signup and no exit path. Access requires
  registration, a B1 or B2 certification form, acceptance of the British Airways API and
  Services Trial Use Agreement plus the Travel Agency Addendum for IATA accredited agents, and
  signed live API contracts. The older public consumer REST APIs (Flight Information, Flight
  Offers, Lowest Prices, In-Flight Entertainment, Hotel/Car/Flight packages) on the IAG
  Developer Programs portal are gone: as of 2026-07-28 developer.iairgroup.com returns HTTP 404
  and api.ba.com returns HTTP 596 ERR_596_SERVICE_NOT_FOUND for every documented resource.
