actions:
  apisYmlCreated: true
  openapiHarvested: false
  specsCount: 0
  reason: >-
    No machine-readable API contract of any kind is published by British Airways, IAG or the
    NDC hub. Nothing was written to openapi/ because inventing one would be fabrication. The
    single apis[] entry describes the NDC API as it is actually documented, with no baseURL,
    because BA publishes no production host.
