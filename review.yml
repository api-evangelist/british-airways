aid: british-airways
name: British Airways
review:
  question: >-
    Does British Airways publish a public, self-serve developer surface, and what would it
    cost a customer to leave British Airways as a distribution supplier?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  summary: >-
    No. British Airways has no self-serve developer portal and no machine-readable API
    contract in the public domain. Its only live API-facing property is ndc.ba.com, the
    British Airways NDC Communication Hub, an Angular single-page application whose
    documentation, sandbox and registration flows sit behind a Microsoft Entra External ID
    login. The historic IAG Developer Programs portal (TIBCO Mashery) that carried BA's
    public consumer REST APIs is gone.

findings:
  portals:
  - url: https://ndc.ba.com/
    status: 200
    fetched: '2026-07-28'
    verdict: live
    note: >-
      British Airways NDC Communication Hub. Angular SPA served from Contentful
      (space nwnmkeyu03hy). Every path returns the same ~17KB SPA shell, so HTTP 200 is not
      evidence that a given page renders content unauthenticated. The app bundle
      (main.7a41cb6e4d2487f7.js, 3.8MB, fetched 2026-07-28) carries the full router, an
      MSAL / Microsoft Entra External ID login against
      https://baexternalid.ciamlogin.com/45c0456f-2aef-40f6-847e-d3d957348527, and the IATA
      EDIST XML namespace http://www.iata.org/IATA/EDIST/2017.2.
  - url: https://developer.iairgroup.com/british_airways
    status: 404
    fetched: '2026-07-28'
    verdict: dead
    note: >-
      IAG Developer Programs portal. Responds `Area Not found` (14 bytes) with
      `server: Mashery Proxy`. Every path tried returned 404, including /, /robots.txt,
      /sitemap.xml, /british_airways/ApiInfo, /british_airways/plans/ndc, /iberia and
      /files/BA_NDC_Pilot_B1_Certification_Form.pdf. Internet Archive CDX shows successful
      200 captures on 2025-03-13, 2025-05-23 and 2026-02-11, so the portal was live as
