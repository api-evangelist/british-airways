method: searched
source: >-
  https://ndc.ba.com/main.7a41cb6e4d2487f7.js (per-message version routes and roadmap routes);
  archived https://developer.iairgroup.com/british_airways/plans/ndc and
  /british_airways/apis/Flight_Info; live probes of api.ba.com and developer.iairgroup.com on
  2026-07-28.
description: >-
  British Airways versions its API surface at the message level, not at the API level: each NDC
  message carries both the IATA NDC release (17.2) and a British Airways-specific revision
  (V1..V5) in its path. There is no published deprecation policy, no SLA, and no status page.
  The lifecycle evidence that does exist is a record of withdrawal — the entire public REST API
  and the developer portal that documented it were removed, the portal within the last six
  months.
versioning:
  scheme: standard-release-plus-per-message-revision
  mechanism: >-
    URI path segment of the form /<Message>/<NDC release>/<BA revision>, e.g.
    /OrderCreate/17.2/V5. The IATA release moves rarely; the BA revision moves per message and
    independently of the other messages.
  current: '17.2'
  pilot: '21.3'
  observed_message_versions:
    - {message: AirShopping, path: /AirShopping/17.2/V1, revision: V1}
    - {message: OfferPrice, path: /OfferPrice/17.2/V2, revision: V2}
    - {message: SeatAvailability, path: /SeatAvailability/17.2/V2, revision: V2}
    - {message: ServiceList, path: /ServiceList/17.2/V1, revision: V1}
    - {message: OrderCreate, path: /OrderCreate/17.2/V5, revision: V5}
    - {message: OrderRetrieve, path: /OrderRetrieve/17.2/V3, revision: V3}
    - {message: OrderChange, path: /OrderChange/17.2/V4, revision: V4}
    - {message: OrderCancel, path: /OrderCancel/17.2/V1, revision: V1}
    - {message: OrderReshop, path: /OrderReshop/17.2/V3, revision: V3}
  note: >-
    These are relative paths hard-coded into the NDC hub's own in-browser sandbox screens. No
    host is published alongside them, so no baseURL is asserted anywhere in this repository.
roadmap:
  published: true
  urls:
    - https://ndc.ba.com/developer/ndc-product-api-roadmap
    - https://ndc.ba.com/capability/ndc-21.3-development-roadmap
  access: gated
  note: >-
    Both are routes in the NDC hub's Angular router and both return the SPA shell to an
    unauthenticated client, so the roadmap exists as a published destination but its contents
    could not be read without a Microsoft Entra External ID login.
migration_guides:
